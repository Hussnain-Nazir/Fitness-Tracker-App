name: fitness_tracker
description: A Fitness Tracker App built with Flutter (Material 3).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local key-value persistence (favorites, profile, completed workouts)
  shared_preferences: ^2.2.2

  # Real HTTP calls to the Open-Meteo weather API
  http: ^1.2.1

  # Real scheduled/local push notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
